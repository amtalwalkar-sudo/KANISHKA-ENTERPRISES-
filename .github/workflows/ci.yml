name: KFE 2.0 CI
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run preview -- --host 127.0.0.1 > /tmp/kfe-preview.log 2>&1 &
      - run: node tests/business-runtime.mjs
      - run: node tests/resilience.mjs
