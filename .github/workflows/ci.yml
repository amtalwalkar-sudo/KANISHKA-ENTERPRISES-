name: KFE 2.0 CI
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Start production preview
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/kfe-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/kfe-preview.log
          exit 1
      - name: Business runtime proof
        env:
          KFE_BASE_URL: http://127.0.0.1:4173/
        run: node tests/business-runtime.mjs
      - name: Offline and resilience proof
        env:
          KFE_BASE_URL: http://127.0.0.1:4173/
        run: node tests/resilience.mjs
