name: KFE 2.0 Enforcement
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm install
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run preview -- --host 127.0.0.1 > /tmp/kfe-vite.log 2>&1 &
      - run: node tests/business-runtime.mjs
